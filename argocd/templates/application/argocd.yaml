apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
      - values.yaml
      - secrets/values.enc.yaml
    path: argocd
    repoURL: https://github.com/green-ecolution/k8s-infrastructure.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - Validate=false
    - PruneLast=true
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true

