apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: keycloak
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
      - secrets/values.enc.yaml
      - values.yaml
    path: keycloak
    repoURL: https://github.com/green-ecolution/k8s-infrastructure.git
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - Validate=false

