traefik:
  additionalArguments:
    - "--providers.kubernetesingress.ingressendpoint.publishedservice=traefik/traefik-ingress-controller"
    - "--log.level=INFO"

  ports:
    web:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  logs:
    access:
      enabled: true
