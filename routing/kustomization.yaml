apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ors
  - vroom
  - valhalla

images:
  - name: vroom-image
    newName: ghcr.io/vroom-project/vroom-docker
    newTag: v1.14.0
  - name: ors-image
    newName: openrouteservice/openrouteservice
    newTag: v9.0.0
  - name: valhalla-image
    newName: ghcr.io/gis-ops/docker-valhalla/valhalla
    newTag: latest
