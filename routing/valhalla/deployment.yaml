# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  labels:
    app: valhalla
spec:
  selector:
    matchLabels:
      app: valhalla
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  valhalla
      labels:
        app: valhalla
    spec:
      containers:
      - name: valhalla
        image: valhalla-image
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /status
            port: 8002
          initialDelaySeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 5
        startupProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 60
          periodSeconds: 5
        env:
          - name: tile_urls
            value: https://download.geofabrik.de/europe/germany/schleswig-holstein-latest.osm.pbf
        volumeMounts:
          - name: valhalla-volume
            mountPath: /custom_files
        ports:
        - containerPort: 8002
          name: http
      volumes:
        - name: valhalla-volume
          persistentVolumeClaim: 
            claimName: valhalla-pvc
      restartPolicy: Always

