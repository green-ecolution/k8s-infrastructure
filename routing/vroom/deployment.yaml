# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vroom
  labels:
    app: vroom
spec:
  selector:
    matchLabels:
      app: vroom
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container:  vroom
      labels:
        app: vroom
    spec:
      containers:
      - name: vroom
        image: vroom-image
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 100Mi
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: vroom-config
          mountPath: /conf/config.yml
          subPath: config.yml
      volumes:
        - name: vroom-config
          configMap:
            name: vroom-config
            items: 
              - key: config.yml
                path: config.yml
      restartPolicy: Always

